  <script>
/* ViaCerta 1.5.1 — correção do orçamento inicial do combustível. */
(() => {
'use strict';
const KEY = 'viacerta-v1-data';
const VEHICLE_TYPES = [
 ['proprio','🚗 Próprio'],['empresa','🏢 Da empresa'],
 ['alugado','🔑 Alugado'],['emprestado','🤝 Emprestado'],
 ['outro','🚘 Outro']
];
const vehicleTypeLabel = value => VEHICLE_TYPES.find(([id])=>id===value)?.[1] || 'Não informado';
const vehicleTypeSelect = (name, value='proprio') => `<div class="field"><label for="f-${name}">Tipo de veículo</label><select id="f-${name}" name="${name}">${VEHICLE_TYPES.map(([id,label])=>`<option value="${id}" ${value===id?'selected':''}>${label}</option>`).join('')}</select></div>`;
// Somente a escolha do combustível é manual: unidade e rótulos são automáticos.
const FUELS = [
 ['gasolina','⛽ Gasolina','L','Litros abastecidos'],
 ['etanol','🌱 Etanol','L','Litros abastecidos'],
 ['diesel','🚚 Diesel','L','Litros abastecidos'],
 ['gnv','💨 Gás (GNV)','m³','Metros cúbicos abastecidos'],
 ['eletrico','⚡ Recarga elétrica','kWh','Energia recarregada (kWh)']
];
const fuelConfig = kind => FUELS.find(([id])=>id===kind)||FUELS[0];
const fuelKindFromText = value => {const s=String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 if(s.includes('etanol')||s.includes('alcool'))return 'etanol';
 if(s.includes('diesel'))return 'diesel';
 if(s.includes('gnv')||s.includes('gas natural'))return 'gnv';
 if(s.includes('eletric')||s.includes('recarga'))return 'eletrico';
 if(s.includes('gasolina'))return 'gasolina';
 return null;
};
const fuelQuantity = e => fnum(e.quantity??e.liters);
const expenseFuelKind = e => e.fuelKind||fuelKindFromText(e.fuelType)||null;
const expenseFuelUnit = e => e.fuelUnit || (expenseFuelKind(e)?fuelConfig(expenseFuelKind(e))[2]:'L');
const tripFuelUnit = t => fuelConfig(fuelKindFromText(t.fuelType))[2];
const CATS = [
 ['combustivel','⛽','Combustível'], ['alimentacao','🍴','Alimentação'],
 ['hospedagem','🛏️','Hospedagem'], ['pedagio','🛣️','Pedágios'],
 ['conveniencia','☕','Conveniência'], ['estacionamento','🅿️','Estacionamento'],
 ['outros','🧾','Outros'], ['imprevistos','🧰','Imprevistos']
];
const defaults = () => ({trips:[],expenses:[],vehicles:[],activeTripId:null,lastFuelKind:'gasolina'});
let data = load();
let tab = 'inicio';
let modalType = '';
let editingId = null;
let category = 'alimentacao';
let pendingTrip = null; // ID da viagem de ida ao criar o retorno
let toastTimer = null;
const $ = id => document.getElementById(id);
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const kmFmt = v => Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:1});
const fnum = v => {let s=String(v??'').trim().replace(/\s/g,'');if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');let n=Number(s);return Number.isFinite(n)?n:0;};
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');};
const uid=()=> (globalThis.crypto?.randomUUID?.() || (Date.now().toString(36)+Math.random().toString(36).slice(2)));
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.trips)&&Array.isArray(s.expenses)&&Array.isArray(s.vehicles))return {...defaults(),...s};}catch(_){}return defaults();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true;}catch(e){alert('Não foi possível salvar no aparelho. Libere espaço ou exporte um backup.');return false;}}
function tell(message){const t=$('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500);}
function getTrip(){return data.trips.find(t=>t.id===data.activeTripId)||data.trips[0]||null;}
function datesCount(a,b){if(!a||!b)return 1;const x=new Date(a+'T12:00:00'),y=new Date(b+'T12:00:00');return Math.max(1,Math.ceil((y-x)/86400000)+1);}
function tripKm(t){return Math.max(0,Number(t.manualKm)>0?Number(t.manualKm):Number(t.routeKm)||0);}
function baselineBudget(t,p){return t.originalBudget&&Number.isFinite(t.originalBudget.total)?t.originalBudget:p;}
// Corrige uma falha das versões anteriores: a viagem podia ser salva sem km,
// gerando combustível previsto R$ 0. Se a distância só era informada depois de
// lançar um gasto, o orçamento original congelado continuava sem combustível.
// Ajustamos UMA ÚNICA VEZ essa parcela ausente, preservando demais categorias,
// os gastos realizados e uma previsão original que já possuía quilometragem.
function repairMissingFuelBaseline(t){
 const b=t.originalBudget;
 if(!b||!b.by||!Number.isFinite(b.total)||fnum(b.by.combustivel)>0||fnum(t.originalKm)>0)return false;
 const km=tripKm(t),p=plan(t);
 if(km<=0||p.by.combustivel<=0)return false;
 b.by.combustivel=p.by.combustivel;
 b.total+=p.by.combustivel;
 t.originalKm=km;
 b.fuelBaselineRestored=true;
 return true;
}
function migrateOlderTrips(){
 let modified=false;

 // Somente abastecimentos posteriores ao marco inicial, inclusive a reposição de chegada.

 const btn=document.querySelector('[data-action="compute-route"]');if(btn){btn.disabled=true;btn.textContent='Consultando Google...';}

  const payload=await callRoute({mode:'initial',origin:t.origin,destination:t.destination,stops:t.stops||[],roundTrip:!!t.roundTrip,returnDestination:t.origin,returnStops:[...(t.stops||[])].reverse(),includeTolls:true});
  t.routeKm=payload.distanceKm;t.routeDurationSeconds=payload.durationSeconds||0;t.routeKey=routeKey(t);t.manualKm=0;
  if(payload.tollAvailable){t.tollBudget=Number(payload.tollBRL.toFixed(2));t.tollSource='google';}
  else t.tollSource='manual';
  refreshBaseline(t);
  save();tripDetails(id);render();
  tell(payload.tollAvailable?'Distância e pedágios estimados pelo Google!':'Distância calculada. Pedágios não disponíveis: informe manualmente.');
 }catch(e){tell(e.message||'Erro ao calcular.');if(btn){btn.disabled=false;btn.textContent='📍 Calcular rota';}}
}

function action(name,id,elem){switch(name){case 'new-trip':closeModal();tripModal();break;case 'create-return':createReturn(id);break;case 'compare-trip':compareTripModal(id);break;case 'edit-trip':closeModal();tripModal(id);break;case 'new-vehicle':closeModal();vehicleModal();break;case 'edit-vehicle':closeModal();vehicleModal(id);break;case 'new-expense':closeModal();expenseModal();break;case 'edit-expense':closeModal();expenseModal(id);break;case 'trip-detail':tripDetails(id);break;case 'select-trip':closeModal();data.activeTripId=id;save();tab='inicio';render();tell('Viagem selecionada.');break;case 'set-distance':distanceModal(id);break;case 'compute-route':computeRoute(id);break;case 'progress':progressModal(id);break;case 'close-stage':closingModal(id);break;case 'reopen-stage':reopenLast(id);break;case 'close-modal':closeModal();break;case 'choose-cat':category=elem.dataset.cat;$('f-category').value=category;document.querySelectorAll('[data-action="choose-cat"]').forEach(b=>b.classList.toggle('selected',b.dataset.cat===category));$('fuel-fields').classList.toggle('hide',category!=='combustivel');break;case 'export-data':exportData();break;case 'import-data':$('import-json').click();break;
 case 'delete-expense':if(data.trips.some(t=>isStageClosed(t,(data.expenses.find(e=>e.id===id)?.phase||'ida'))&&data.expenses.find(e=>e.id===id)?.tripId===t.id)){tell('Reabra a etapa antes de excluir esse lançamento.');break;}if(confirm('Excluir este lançamento?')){data.expenses=data.expenses.filter(x=>x.id!==id);save();closeModal();render();tell('Despesa excluída.');}break;
 case 'delete-vehicle':if(confirm('Excluir o veículo cadastrado? As viagens anteriores não serão apagadas.')){data.vehicles=data.vehicles.filter(x=>x.id!==id);save();render();tell('Veículo excluído.');}break;
 case 'delete-trip':if(pairedReturn(data.trips.find(x=>x.id===id)||{})){tell('Há um retorno vinculado a esta ida. Faça backup e exclua o retorno antes de apagar a ida.');break;}if(confirm('Excluir esta viagem e todas as suas despesas? Esta ação não poderá ser desfeita.')){data.trips=data.trips.filter(x=>x.id!==id);data.expenses=data.expenses.filter(x=>x.tripId!==id);if(data.activeTripId===id)data.activeTripId=data.trips[0]?.id||null;save();closeModal();render();tell('Viagem excluída.');}break;
 case 'clear-data':if(confirm('APAGAR todas as viagens, despesas e veículos? Faça um backup antes.')&&confirm('Confirmar exclusão definitiva dos dados neste aparelho?')){data=defaults();save();closeModal();tab='inicio';render();tell('Dados locais apagados.');}break;
 }}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-nav]');if(!b)return;if(b.dataset.nav){tab=b.dataset.nav;render();return;}if(b.dataset.action){e.preventDefault();action(b.dataset.action,b.dataset.id,b);}});
document.addEventListener('submit',e=>{const f=e.target;if(!['trip-form','vehicle-form','expense-form','distance-form','progress-form','closing-form'].includes(f.id))return;e.preventDefault();if(f.id==='trip-form')submitTrip(f);if(f.id==='vehicle-form')submitVehicle(f);if(f.id==='expense-form')submitExpense(f);if(f.id==='progress-form')submitProgress(f);if(f.id==='closing-form')submitClosing(f);if(f.id==='distance-form'){const t=data.trips.find(x=>x.id===editingId);const val=fnum(f.elements.km.value);if(!t||val<=0)return showError('Informe uma distância maior que zero.');t.manualKm=val;refreshBaseline(t);save();closeModal();render();tell('Quilometragem ajustada.');}});
document.addEventListener('change',e=>{if(e.target?.id==='import-json')importData(e.target.files?.[0]);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalType)closeModal();});
$('btn-settings').addEventListener('click',settingsModal);
migrateOlderTrips();
render();

})();

</script>
<script>
// Instala o suporte offline somente na hospedagem HTTPS. Não afeta viagens nem localStorage.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.warn('ViaCerta: suporte offline indisponível nesta sessão.', err);
    });
  });
}
</script>
